# Starship Configuration
# ~/.config/starship.toml

# ==================== FORMAT ====================
format = """
[┌───────────────>](bold #7e9cd8) $username@$hostname
[│](bold #7e9cd8)  $directory$git_branch$git_status$nodejs$python$rust
[└─>](bold #7e9cd8) $character"""

# Transient prompt for faster input after first command
transient_prompt = "[➜](#7e9cd8) "

# ==================== TIMEOUT ====================
command_timeout = 500
scan_timeout = 10

# ==================== DIRECTORY ====================
[directory]
truncation_length = 3
truncate_to_repo = true
home_symbol = "~"
read_only = "🔒"
read_only_style = "bold #c34043"
style = "bold #7fb4ca"
format = "[$read_only$path]($style) "

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "
"Videos" = " "
"Projects" = "󰲋 "
"work" = "󰼁 "
"dev" = " "

# ==================== GIT ====================
[git_branch]
symbol = " "
truncation_length = 20
truncation_symbol = "…"
style = "bold #938aa9"
format = "on [$symbol$branch]($style) "

[git_status]
style = "bold #c34043"
conflicted = "🏳‍🌈"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?${count}"
stashed = "$${count}"
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "✘${count}"
format = '([$all_status$ahead_behind]($style) )'

# ==================== PROGRAMMING LANGUAGES ====================
[nodejs]
symbol = " "
style = "bold #76946a"
format = "[$symbol($version )]($style)"
detect_extensions = ["js", "mjs", "cjs", "ts", "jsx", "tsx", "json"]
detect_files = ["package.json", ".node-version"]

[python]
symbol = " "
style = "bold #7e9cd8"
format = "[$symbol($version )]($style)"
detect_extensions = ["py"]
detect_files = [".python-version", "Pipfile", "__pycache__", "pyproject.toml", "requirements.txt", "setup.py", "tox.ini"]

[rust]
symbol = "🦀"
style = "bold #c0a36e"
format = "[$symbol($version )]($style)"
detect_extensions = ["rs"]
detect_files = ["Cargo.toml"]

[golang]
symbol = "󰟓 "
style = "bold #7fb4ca"
format = "[$symbol($version )]($style)"
detect_extensions = ["go"]
detect_files = ["go.mod", "go.sum", "go.work"]

[ruby]
symbol = " "
style = "bold #c34043"
format = "[$symbol($version )]($style)"
detect_extensions = ["rb"]
detect_files = ["Gemfile", "Rakefile"]

# ==================== TOOLS ====================
[docker_context]
symbol = "🐳 "
style = "bold #7e9cd8"
format = "[$symbol($context )]($style)"
detect_extensions = []
detect_files = ["docker-compose.yml", "docker-compose.yaml", "Dockerfile"]

[package]
symbol = "📦 "
style = "bold #c0a36e"
format = "[$symbol($version )]($style)"
display_private = false

# ==================== SYSTEM ====================
[username]
style_user = "bold #c0a36e"
style_root = "bold #c34043"
format = "[$user]($style)"
disabled = false
show_always = false

[hostname]
ssh_only = true
ssh_symbol = "🌐 "
style = "bold #76946a"
format = "[$ssh_symbol$hostname]($style)"
disabled = false

[character]
success_symbol = "[➜](#76946a)"
error_symbol = "[➜](#c34043)"
vimcmd_symbol = "[V](#c0a36e)"

# ==================== TIME ====================
[time]
disabled = false
format = "🕙[$time]($style) "
time_format = "%R"
style = "bold #938aa9"

# ==================== STATUS ====================
[status]
symbol = "✖"
success_symbol = ""
format = '[\[$symbol $common_meaning$signal_name\]]($style) '
map_symbol = true
disabled = false
style = "bold #c34043"
recognize_signal_code = true
recognize_exit_code = true

# ==================== AWS ====================
[aws]
format = '[$symbol($profile )(\($region\) )]($style)'
symbol = "☁️ "
disabled = true

